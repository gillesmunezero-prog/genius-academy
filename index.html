<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genius Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#fef6e9;
--card:#ffffff;
--ink:#2d2a4a;
--ink2:#6b6890;
--gold:#ffb400;
--green:#2ecc71;
--blue:#3aa0ff;
--purple:#a06bff;
--orange:#ff9f43;
--pink:#ff5d8f;
--red:#ff5252;
--line:#eee2cf;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:'Nunito',Arial,sans-serif;background:linear-gradient(160deg,#fff6e5,#e8f7ff 60%,#ffeef7);color:var(--ink);min-height:100vh;}
h1,h2,h3{font-family:'Baloo 2',cursive;margin:0 0 10px;}
.screen{display:none;padding:18px 16px 60px;max-width:760px;margin:0 auto;}
.screen.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
header{background:var(--card);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.05);}
header .logo{font-size:24px;font-weight:800;color:#ff8a00;font-family:'Baloo 2',cursive;display:flex;align-items:center;gap:8px;}
.stars-bar{font-size:20px;color:#c97e00;font-weight:800;background:#fff3d6;padding:6px 14px;border-radius:20px;border:2px solid var(--gold);}
nav.tabs{display:flex;gap:8px;padding:10px 16px;background:transparent;flex-wrap:wrap;max-width:760px;margin:0 auto;}
nav.tabs button{background:var(--card);border:2px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:700;font-family:'Nunito';}
nav.tabs button.active{background:#ff8a00;color:#fff;border-color:#ff8a00;}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 16px rgba(90,60,20,.08);border:2px solid var(--line);}
.btn{background:#ff8a00;color:#fff;border:none;padding:14px 22px;border-radius:16px;font-weight:800;cursor:pointer;font-size:16px;font-family:'Baloo 2';box-shadow:0 4px 0 #d96f00;}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d96f00;}
.btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
.btn.green{background:var(--green);box-shadow:0 4px 0 #219150;}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.profiles-grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;}
.profile-card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px 18px;width:150px;text-align:center;cursor:pointer;transition:.15s;position:relative;}
.profile-card:hover{border-color:var(--gold);transform:translateY(-4px) scale(1.03);}
.profile-card .avatar{font-size:54px;}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.subject-tile{border-radius:20px;padding:18px;text-align:center;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:.15s;}
.subject-tile:hover{transform:translateY(-3px);}
.subject-tile .emoji{font-size:38px;}
.subject-tile .name{font-family:'Baloo 2';font-size:18px;margin-top:6px;}
.subject-tile .prog{font-size:12px;margin-top:6px;opacity:.9;}
.tile-maths{background:linear-gradient(160deg,#2ecc71,#20a85c);}
.tile-francais{background:linear-gradient(160deg,#3aa0ff,#1f7ee0);}
.tile-anglais{background:linear-gradient(160deg,#a06bff,#8248e5);}
.tile-geographie{background:linear-gradient(160deg,#ff9f43,#e6822a);}
.tile-lecture{background:linear-gradient(160deg,#ff5d8f,#e63f72);}
.lesson-item{display:flex;align-items:center;gap:14px;background:#fbf7ee;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer;}
.lesson-item.locked{opacity:.5;cursor:not-allowed;}
.lesson-item.done{border-color:var(--green);}
.lesson-item .num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Baloo 2';flex-shrink:0;}
.lesson-item .info{flex:1;}
.lesson-item .title{font-weight:800;font-family:'Baloo 2';font-size:16px;}
.lesson-item .meta{font-size:12px;color:var(--ink2);}
.mascot-bubble{display:flex;gap:12px;align-items:flex-start;background:#eafaf1;border:2px solid #bdeecb;border-radius:16px;padding:14px;margin-bottom:16px;}
.mascot-bubble .emoji{font-size:36px;}
.mascot-bubble p{margin:0;font-weight:700;}
.cours-badge{display:inline-block;background:#eafaf1;color:#1f9d55;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:10px;}
.cours-text p{line-height:1.7;font-size:16px;margin:0 0 10px;}
.cours-example{background:#fff8e6;border:2px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:700;}
.vocab-line{display:flex;justify-content:space-between;background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:8px;border:2px solid var(--line);font-weight:700;}
.reading-text{background:#fbf7ee;border-radius:16px;padding:18px;line-height:1.8;font-size:17px;margin-bottom:16px;border:2px solid var(--line);}
.question-box{background:#fbf7ee;border-radius:18px;padding:24px;text-align:center;border:2px solid var(--line);}
.question-box .qlabel{font-size:12px;color:var(--ink2);font-weight:800;margin-bottom:6px;}
.question-box .q{font-size:22px;font-weight:800;margin-bottom:18px;font-family:'Baloo 2';}
.answers{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.answers button{background:#fff;border:3px solid var(--line);color:var(--ink);padding:14px 20px;border-radius:14px;font-size:17px;cursor:pointer;min-width:70px;font-weight:700;font-family:'Nunito';}
.answers button:hover{border-color:var(--gold);background:#fff8e6;}
.answers button.correct{background:#e3fbe9;border-color:var(--green);}
.answers button.wrong{background:#ffe9e9;border-color:var(--red);}
.feedback{margin-top:16px;font-size:17px;font-weight:800;min-height:26px;}
.feedback.ok{color:#1f9d55;}
.feedback.ko{color:#e04545;}
.progress-outer{background:#eee2cf;border-radius:10px;height:14px;overflow:hidden;margin:14px 0;}
.progress-inner{background:linear-gradient(90deg,#ffb400,#ff8a00);height:100%;transition:width .3s;}
input[type=text]{background:#fff;border:2px solid var(--line);color:var(--ink);padding:12px;border-radius:10px;font-size:17px;font-family:'Nunito';}
table.parent-table{width:100%;border-collapse:collapse;}
table.parent-table th,table.parent-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px;}
.badge-pill{display:inline-block;background:#fff3d6;color:#c97e00;border:2px solid var(--gold);padding:5px 12px;border-radius:20px;font-size:13px;margin:4px 4px 0 0;font-weight:800;}
.avatar-pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.avatar-pick span{font-size:28px;padding:6px;border-radius:10px;border:2px solid transparent;cursor:pointer;}
.avatar-pick span.sel{border-color:var(--gold);background:#fff3d6;}
.track-label{display:inline-block;background:#eafaf1;color:#1f9d55;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800;margin-left:8px;}
.result-emoji{font-size:60px;text-align:center;margin-bottom:10px;}
.del-x{position:absolute;top:6px;right:8px;font-size:14px;color:#c33;cursor:pointer;opacity:.6;}
.del-x:hover{opacity:1;}
</style>
</head>
<body>
<header>
<div class="logo">🦉 Genius Academy</div>
<div id="starsDisplay" class="stars-bar" style="display:none;"></div>
</header>
<nav class="tabs" id="mainNav" style="display:none;">
<button data-screen="screen-home" class="navbtn">🏠 Accueil</button>
<button data-screen="screen-rewards" class="navbtn">🏆 Récompenses</button>
<button data-screen="screen-parent" class="navbtn">👪 Espace parent</button>
<button id="switchProfileBtn">🔄 Changer</button>
</nav>
<main>

<section id="screen-select-profile" class="screen active">
<div style="text-align:center;margin-bottom:10px;">
<h1>Bienvenue sur Genius Academy !</h1>
<p>Choisis ton profil pour commencer l'aventure du jour 🚀</p>
</div>
<div class="profiles-grid" id="profilesGrid"></div>
<div class="card" style="margin-top:22px;max-width:420px;margin-left:auto;margin-right:auto;">
<h2>➕ Ajouter un enfant</h2>
<input type="text" id="newProfileName" placeholder="Prenom de l'enfant" style="width:100%;">
<div style="margin:12px 0;">
<label><input type="radio" name="track" value="7" checked> Parcours 7 ans (CE1)</label><br><br>
<label><input type="radio" name="track" value="9"> Parcours 9 ans (CE2-CM1)</label>
</div>
<div class="avatar-pick" id="avatarPick"></div>
<button class="btn" id="addProfileBtn">Créer le profil</button>
</div>
</section>

<section id="screen-home" class="screen">
<div class="mascot-bubble">
<div class="emoji">🦉</div>
<p id="mascotHomeMsg">Bonjour !</p>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
<h2 id="homeGreeting" style="margin:0;">Bonjour</h2>
<div id="streakDisplay" style="font-weight:800;color:#e67e22;"></div>
</div>
<div class="progress-outer"><div class="progress-inner" id="dayProgress" style="width:0%;"></div></div>
<div id="dayProgressLabel" style="font-size:13px;color:var(--ink2);"></div>
</div>
<div class="subject-grid" id="subjectGrid"></div>
</section>

<section id="screen-subject" class="screen">
<button class="btn secondary backbtn">⬅ Retour</button>
<h1 id="subjectTitle">Matière</h1>
<div id="lessonList"></div>
</section>

<section id="screen-lesson" class="screen">
<button class="btn secondary backbtn">⬅ Retour</button>
<div id="lessonCard"></div>
</section>

<section id="screen-rewards" class="screen">
<h1>🏆 Mes Récompenses</h1>
<div class="card" style="text-align:center;">
<div class="stars-bar" id="rewardsStars" style="font-size:26px;"></div>
<div class="progress-outer"><div class="progress-inner" id="badgeProgress" style="width:0%;"></div></div>
<p id="badgeNext"></p>
</div>
<div class="card">
<h2>Badges débloqués</h2>
<div id="badgesList"></div>
</div>
</section>

<section id="screen-parent" class="screen">
<h1>👪 Espace Parent</h1>
<div class="card">
<table class="parent-table" id="parentTable">
<thead><tr><th>Enfant</th><th>Parcours</th><th>Étoiles</th><th>Série</th><th>Leçons faites</th><th>Dernière activité</th></tr></thead>
<tbody id="parentTbody"></tbody>
</table>
</div>
<div class="card" id="parentDetail"></div>
</section>

</main>
<script>

const STORAGE_KEY='geniusAcademyData';
const AVATARS=['🦄','🐱','🐶','🦋','🐼','🦉','🐰','🦊','🐸','🐧'];
function loadData(){
try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{profiles:[],currentId:null};}catch(e){return {profiles:[],currentId:null};}
}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}
let DATA=loadData();
function todayStr(){return new Date().toISOString().slice(0,10);}
function getProfile(id){return DATA.profiles.find(function(p){return p.id===id;});}
function getCurrentProfile(){return getProfile(DATA.currentId);}
function createProfile(name,track,avatar){
const p={id:'p'+Date.now()+Math.floor(Math.random()*1000),name:name,track:String(track),avatar:avatar||(String(track)==='9'?'🦉':'🦄'),stars:0,badges:[],progress:{},streak:0,lastLessonDate:'',lastActive:'-'};
DATA.profiles.push(p);
saveData(DATA);
return p;
}
function migrateProfiles(){
var changed=false;
DATA.profiles.forEach(function(p){
if(p.name==='Lina'){p.name='Louise';changed=true;}
if(p.name==='Noe'||p.name==='Noé'){p.name='Béatrice';changed=true;}
if(!p.avatar){p.avatar=p.track==='9'?'🦉':'🦄';changed=true;}
if(!p.progress){p.progress={};changed=true;}
if(typeof p.streak!=='number'){p.streak=0;changed=true;}
if(typeof p.lastLessonDate!=='string'){p.lastLessonDate='';changed=true;}
if(p.missionsDoneToday){delete p.missionsDoneToday;changed=true;}
});
if(DATA.profiles.length===0){
createProfile('Louise','7','🦄');
createProfile('Béatrice','9','🦉');
changed=true;
}
if(changed)saveData(DATA);
}
function ensureProgress(p,subject,count){
if(!p.progress[subject])p.progress[subject]=[];
while(p.progress[subject].length<count)p.progress[subject].push(false);
}
const SUBJECTS=[
{key:'maths',name:'Mathématiques',emoji:'🔢',tile:'tile-maths'},
{key:'francais',name:'Français',emoji:'📘',tile:'tile-francais'},

const CONTENT={maths:{},francais:{},anglais:{},geographie:{},lecture:{}};
CONTENT.maths['7']=[
{title:'Calcul mental',emoji:'⚡',procedural:'calc7',badge:'Nombres et calcul',cours:[

example:"Exemple : 8 + 5, je pars de 8 et j'avance de 5 : 9, 10, 11, 12, 13. Le résultat est 13."},
{title:"Les nombres jusqu'à 100",emoji:'🔢',badge:'Nombres',cours:[

exercises:[
{type:'qcm',q:'Combien de dizaines y a-t-il dans 63 ?',choices:['5','6','7','8'],correct:1,explain:"63 = 6 dizaines et 3 unités."},

{type:'qcm',q:"Dans 36, il y a 3 dizaines et ... unités.",choices:['3','6','9','0'],correct:1,explain:"36 = 3 dizaines et 6 unités."},
{type:'qcm',q:'Quel est le plus petit de ces nombres ?',choices:['45','54','44','55'],correct:2,explain:"44 est plus petit que 45, 54 et 55."},
{type:'text',q:'Écris en chiffres : soixante-douze',answer:'72',explain:"Soixante-douze s'écrit 72."}
]},
{title:"L'addition posée",emoji:'➕',badge:'Calcul',cours:[

exercises:[
{type:'qcm',q:'27 + 16 = ?',choices:['43','42','44','53'],correct:0,explain:"27 + 16 = 43."},

{type:'qcm',q:"Quand la somme des unités dépasse 9, on pose une...",choices:['retenue','virgule','dizaine en moins','division'],correct:0,explain:"On pose une retenue qu'on ajoute aux dizaines."},

function generateMathQuestion(kind){
let a,b,op,answer,text;
if(kind==='calc9'){
const ops=['x','div','frac'];
op=ops[Math.floor(Math.random()*ops.length)];
if(op==='x'){a=Math.floor(Math.random()*9)+2;b=Math.floor(Math.random()*9)+2;answer=a*b;text=a+' × '+b;}
else if(op==='div'){b=Math.floor(Math.random()*9)+2;answer=Math.floor(Math.random()*9)+2;a=b*answer;text=a+' ÷ '+b;}
else{const den=[2,4,5,10][Math.floor(Math.random()*4)];const num=Math.floor(Math.random()*den);answer=Math.round((num/den)*100);text=num+'/'+den+' en pourcentage';}
}else{
const ops=['add','sub'];
op=ops[Math.floor(Math.random()*ops.length)];
a=Math.floor(Math.random()*15)+1;b=Math.floor(Math.random()*15)+1;
if(op==='sub'&&b>a){const tmp=a;a=b;b=tmp;}
answer=op==='add'?a+b:a-b;
text=a+(op==='add'?' + ':' - ')+b;
}
return {text:text,answer:answer};
}
function currentExercise(){
const lesson=lessonState.lesson;
if(lesson.procedural){
if(!lessonState.proceduralQuestions[lessonState.exIndex]){
const q=generateMathQuestion(lesson.procedural);
let choices=[q.answer];
let pool=[];
for(let d=-8;d<=8;d++){if(d!==0){const c=q.answer+d;if(c>=0&&pool.indexOf(c)<0)pool.push(c);}}
pool.sort(function(){return Math.random()-0.5;});
for(let i=0;i<3&&i<pool.length;i++){choices.push(pool[i]);}
choices.sort(function(){return Math.random()-0.5;});
lessonState.proceduralQuestions[lessonState.exIndex]={type:'qcm',q:q.text+' = ?',choices:choices.map(String),correct:choices.indexOf(q.answer),explain:''};
}
return lessonState.proceduralQuestions[lessonState.exIndex];
}
return lesson.exercises[lessonState.exIndex];
}

function bumpStreak(p){
const t=todayStr();
if(p.lastLessonDate===t)return;
const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
p.streak=(p.lastLessonDate===y)?(p.streak+1):1;
p.lastLessonDate=t;
}
function finishLesson(){
if(lessonState.finished)return;
lessonState.finished=true;
const p=getCurrentProfile();
ensureProgress(p,lessonState.subjectKey,CONTENT[lessonState.subjectKey][p.track].length);
const already=p.progress[lessonState.subjectKey][lessonState.lessonIndex];
p.progress[lessonState.subjectKey][lessonState.lessonIndex]=true;
const base=lessonState.total;
const bonus=(lessonState.mistakes===0)?3:0;
const stars=already?Math.max(1,Math.round(base/2)):(base+bonus);
lessonState.starsEarned=stars;
bumpStreak(p);
awardStars(stars);
saveData(DATA);
}

});
const tr=document.createElement('tr');
tr.style.cursor='pointer';
tr.innerHTML='<td>'+p.name+'</td><td>'+p.track+' ans</td><td>⭐ '+p.stars+'</td><td>🔥 '+(p.streak||0)+'</td><td>'+doneLessons+' / '+totalLessons+'</td><td>'+(p.lastActive||'-')+'</td>';
tr.onclick=function(){renderParentDetail(p);};
tbody.appendChild(tr);
});
saveData(DATA);
}
function renderParentDetail(p){
const detail=document.getElementById('parentDetail');
let html='<h2>Détail de '+p.name+'</h2>';
SUBJECTS.forEach(function(meta){
const lessons=CONTENT[meta.key][p.track]||[];
const done=p.progress[meta.key]?p.progress[meta.key].filter(Boolean).length:0;
html+='<div style="margin-bottom:8px;"><strong>'+meta.emoji+' '+meta.name+'</strong> : '+done+' / '+lessons.length+' leçons terminées</div>';
});
detail.innerHTML=html;
}
function initApp(){
migrateProfiles();
renderAvatarPick();
renderProfiles();
document.getElementById('addProfileBtn').onclick=function(){
const nameInput=document.getElementById('newProfileName');
const name=nameInput.value.trim();
if(!name){alert("Merci d'indiquer un prénom.");return;}
const track=document.querySelector('input[name=track]:checked').value;
createProfile(name,track,selectedAvatar);
nameInput.value='';
renderProfiles();
};
document.querySelectorAll('.navbtn').forEach(function(b){
b.onclick=function(){showScreen(b.getAttribute('data-screen'));};
});
document.querySelectorAll('.backbtn').forEach(function(b){
b.onclick=function(){
const sec=b.closest('.screen').id;
if(sec==='screen-subject')showScreen('screen-home');
else if(sec==='screen-lesson')openSubject(lessonState.subjectKey);
};
});
document.getElementById('switchProfileBtn').onclick=function(){
DATA.currentId=null;
saveData(DATA);
document.getElementById('mainNav').style.display='none';
document.getElementById('starsDisplay').style.display='none';
renderProfiles();
showScreen('screen-select-profile');
};
if(DATA.currentId&&getCurrentProfile()){selectProfile(DATA.currentId);}
}
initApp();
</script></body></html>
